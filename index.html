<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240,initial-scale=1,user-scalable=no">
<title>ZUMA — Marble Pop R1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{width:240px;height:282px;background:#07050d;overflow:hidden;font-family:monospace}
#wrap{position:relative;width:240px;height:282px}
#cv{display:block;width:240px;height:282px;background:#0d0a1a}
#hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:6px;color:rgba(207,238,255,.45);pointer-events:none;z-index:6}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="240" height="282"></canvas></div>
<div id="hint">MOVE aim • CLICK shoot • SCROLL swap ball</div>
<script>
(function(){
"use strict";
var W=240,H=282;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');

var AC=null;
function actx(){if(AC===null){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=false}}return AC}
function tone(f0,f1,dur,type,vol,delay){
  var a=actx();if(!a)return;var t=a.currentTime+(delay||0);
  var o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol||0.1,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol,fType,f0,f1,delay){
  var a=actx();if(!a)return;var t=a.currentTime+(delay||0);
  var len=Math.max(1,Math.floor(a.sampleRate*dur));
  var buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  var s=a.createBufferSource();s.buffer=buf;
  var f=a.createBiquadFilter();f.type=fType||'bandpass';
  f.frequency.setValueAtTime(f0||800,t);
  if(f1&&f1!==f0)f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
  f.Q.value=1.2;
  var g=a.createGain();g.gain.setValueAtTime(vol||0.1,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+dur+0.02);
}
function sfx(n){
  if(!actx())return;
  if(n==='launch'){noise(0.09,0.14,'bandpass',1400,300);tone(320,90,0.09,'triangle',0.09);}
  else if(n==='clack'){var p=1800+Math.random()*700;noise(0.025,0.10,'highpass',p);tone(p,p*0.8,0.02,'square',0.03);}
  else if(n==='pop'){tone(520,140,0.14,'sine',0.16);tone(1040,280,0.1,'triangle',0.07);noise(0.08,0.08,'lowpass',2000,500);}
  else if(n==='pop2'){tone(620,170,0.13,'sine',0.16);tone(1240,340,0.1,'triangle',0.07);noise(0.08,0.08,'lowpass',2200,500);}
  else if(n==='pop3'){tone(740,200,0.12,'sine',0.17);tone(1480,400,0.1,'triangle',0.08);noise(0.09,0.09,'lowpass',2500,600);}
  else if(n==='swap'){tone(700,500,0.05,'sine',0.08);}
  else if(n==='power'){tone(520,520,0.07,'sine',0.1);tone(660,660,0.07,'sine',0.1,0.07);tone(880,880,0.1,'sine',0.11,0.14);}
  else if(n==='bomb'){noise(0.35,0.25,'lowpass',900,120);tone(180,40,0.3,'sawtooth',0.14);}
  else if(n==='lose'){tone(320,80,0.5,'sawtooth',0.12);noise(0.3,0.08,'lowpass',500,100);}
  else if(n==='win'){tone(523,523,0.1,'square',0.09);tone(659,659,0.1,'square',0.09,0.1);tone(784,784,0.1,'square',0.09,0.2);tone(1046,1046,0.22,'square',0.11,0.3);}
  else if(n==='levelup'){tone(440,440,0.08,'triangle',0.1);tone(554,554,0.08,'triangle',0.1,0.08);tone(659,659,0.08,'triangle',0.1,0.16);tone(880,880,0.18,'triangle',0.12,0.24);}
  else if(n==='insert'){tone(240,180,0.05,'triangle',0.06);}
  else if(n==='danger'){tone(160,120,0.15,'square',0.05);}
}

var COLORS=[
  {c1:'#ff6b6b',c2:'#a01010',name:'red'},
  {c1:'#5ec8ff',c2:'#0a4a9a',name:'blue'},
  {c1:'#7dff6a',c2:'#0a7a20',name:'green'},
  {c1:'#ffe066',c2:'#9a7a00',name:'yellow'},
  {c1:'#c99aff',c2:'#5a1a9a',name:'purple'},
  {c1:'#ffffff',c2:'#8a8a9a',name:'white'}
];

var state='title';
var lvlIdx=0,score=0,lives=3,combo=0,lastPopT=-9,shake=0,flash=0,flashCol='#fff';
var balls=[],shots=[],parts=[],floats=[],powerups=[];
var path=null,pathLen=0,spawned=0,spawnT=0,slowT=0,revT=0,accT=0;
var aimA=Math.PI/2,curColor=0,nextColor=1,recoil=0,dangerT=0;
var pointer={x:W/2,y:H/2-60},launched=false;

var levels=[
  {colors:4,balls:42,speed:15,turns:3.1,r0:106},
  {colors:5,balls:58,speed:18,turns:3.5,r0:110},
  {colors:5,balls:74,speed:21,turns:3.9,r0:113},
  {colors:6,balls:90,speed:24,turns:4.3,r0:116},
  {colors:6,balls:110,speed:27,turns:4.7,r0:118}
];

function buildPath(L){
  var pts=[],cx=W/2,cy=H/2+4,r1=22;
  var steps=Math.floor(L.turns*160);
  for(var i=0;i<=steps;i++){
    var t=i/steps;
    var ang=t*L.turns*Math.PI*2-Math.PI/2;
    var r=r1+(L.r0-r1)*t;
    var x=cx+Math.cos(ang)*r;
    var y=cy+Math.sin(ang)*r*0.88;
    pts.push({x:x,y:y,d:0});
  }
  var d=0;
  for(var j=1;j<pts.length;j++){
    d+=Math.hypot(pts[j].x-pts[j-1].x,pts[j].y-pts[j-1].y);
    pts[j].d=d;
  }
  path=pts;pathLen=d;
}

function pathPos(dist){
  if(!path||!path.length)return{x:W/2,y:H/2};
  if(dist<=0){var a=path[0];return{x:a.x,y:a.y}}
  if(dist>=pathLen){var b=path[path.length-1];return{x:b.x,y:b.y}}
  var lo=0,hi=path.length-1;
  while(lo<hi){var mid=(lo+hi)>>1;if(path[mid].d<dist)lo=mid+1;else hi=mid}
  var p2=path[lo],p1=path[lo-1]||p2;
  var seg=p2.d-p1.d||1,t=(dist-p1.d)/seg;
  return{x:p1.x+(p2.x-p1.x)*t,y:p1.y+(p2.y-p1.y)*t};
}

function activeColors(){
  var s={};
  for(var i=0;i<balls.length;i++)s[balls[i].color]=1;
  var arr=[];for(var k in s)arr.push(+k);
  return arr.length?arr:null;
}
function pickColor(){
  var act=activeColors(),n=levels[lvlIdx].colors;
  if(act&&Math.random()<0.85)return act[Math.floor(Math.random()*act.length)];
  return Math.floor(Math.random()*n);
}

function loadLevel(idx){
  lvlIdx=idx;
  var L=levels[idx];
  buildPath(L);
  balls=[];shots=[];parts=[];floats=[];powerups=[];
  spawned=0;spawnT=0.6;slowT=0;revT=0;accT=0;combo=0;
  curColor=Math.floor(Math.random()*L.colors);
  nextColor=Math.floor(Math.random()*L.colors);
  recoil=0;dangerT=0;
  state='play';
}

function spawnBall(){
  if(spawned>=levels[lvlIdx].balls)return;
  var last=balls[balls.length-1];
  if(last&&last.d<16)return;
  balls.push({color:pickColor(),d:0});
  spawned++;
}

function ballX(b){return pathPos(b.d)}

function shoot(){
  if(state!=='play'||launched)return;
  var spd=430;
  shots.push({x:W/2,y:H/2+4,vx:Math.cos(aimA)*spd,vy:Math.sin(aimA)*spd,color:curColor});
  curColor=nextColor;nextColor=pickColor();
  launched=true;recoil=1;
  sfx('launch');
  setTimeout(function(){launched=false},90);
}

function swapBalls(){
  if(state!=='play')return;
  var t=curColor;curColor=nextColor;nextColor=t;
  sfx('swap');
}

function nearestPathDist(x,y){
  var best=0,bd=1e9;
  for(var i=0;i<path.length;i+=4){
    var dx=path[i].x-x,dy=path[i].y-y,d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=path[i].d}
  }
  return best;
}

function checkMatch(idx){
  if(idx<0||idx>=balls.length)return false;
  var c=balls[idx].color;
  var a=idx,b=idx;
  while(a>0&&balls[a-1].color===c&&(balls[a-1].dist-balls[a].dist)<15.5)a--;
  while(b<balls.length-1&&balls[b+1].color===c&&(balls[b].dist-balls[b+1].dist)<15.5)b++;
  if(b-a+1>=3){popBalls(a,b);return true}
  return false;
}

function popBalls(a,b){
  var n=b-a+1;
  var now=performance.now()/1000;
  combo=(now-lastPopT<1.6)?combo+1:1;
  lastPopT=now;
  var pts=n*100*combo;
  score+=pts;
  var mid=balls[Math.floor((a+b)/2)];
  var mp=pathPos(mid.d);
  for(var i=a;i<=b;i++){
    var p=pathPos(balls[i].d),col=COLORS[balls[i].color];
    for(var k=0;k<7;k++){
      var ang=Math.random()*Math.PI*2,sp=1+Math.random()*3;
      parts.push({x:p.x,y:p.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-1,life:20+Math.random()*14,col:Math.random()<0.4?'#fff':col.c1,r:1.4+Math.random()*2});
    }
  }
  floats.push({txt:'+'+pts,life:40,x:mp.x,y:mp.y-8,col:'#ffe066',size:9});
  if(combo>=2)floats.push({txt:'COMBO x'+combo,life:46,x:mp.x,y:mp.y-20,col:'#ff9a5a',size:8});
  if(combo>=4)floats.push({txt:'INCREDIBLE!',life:52,x:mp.x,y:mp.y-32,col:'#ff6b6b',size:9});
  if(combo>=2)shake=Math.min(8,shake+combo*0.7);
  flash=Math.min(0.22,0.08*combo);flashCol='#fff';
  sfx(combo>=3?'pop3':combo===2?'pop2':'pop');
  balls.splice(a,n);
  if(balls.length===0){levelClear();return}
  if(Math.random()<0.22){
    var types=['bomb','slow','reverse'];
    powerups.push({d:mid.d,type:types[Math.floor(Math.random()*types.length)],pulse:0});
  }
}

function levelClear(){
  score+=1000+lives*250;
  sfx('win');
  flash=0.3;flashCol='#ffe066';
  if(lvlIdx+1<levels.length){
    floats.push({txt:'LEVEL CLEAR!',life:70,x:W/2,y:H/2-30,col:'#ffe066',size:12});
    floats.push({txt:'+'+(1000+lives*250),life:70,x:W/2,y:H/2-14,col:'#fff',size:9});
    setTimeout(function(){loadLevel(lvlIdx+1);sfx('levelup')},1100);
    state='clear';
  }else{
    floats.push({txt:'YOU WIN!',life:120,x:W/2,y:H/2-20,col:'#ffe066',size:14});
    setTimeout(function(){state='win'},1200);
  }
}

function loseLife(){
  lives--;
  sfx('lose');
  shake=8;flash=0.35;flashCol='#f44';
  balls=[];shots=[];powerups=[];
  combo=0;
  if(lives<=0){setTimeout(function(){state='over'},700);state='dying'}
  else floats.push({txt:'BALLS ESCAPED! -1 LIFE',life:70,x:W/2,y:H/2,col:'#f66',size:10});
}

function update(dt){
  if(state!=='play'&&state!=='dying')return;
  shake=Math.max(0,shake-dt*26);
  flash=Math.max(0,flash-dt*4);
  recoil=Math.max(0,recoil-dt*6);
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.09;p.life--;if(p.life<=0)parts.splice(i,1)}
  for(var f=floats.length-1;f>=0;f--){var fl=floats[f];fl.y-=0.4;fl.life--;if(fl.life<=0)floats.splice(f,1)}
  if(state!=='play')return;

  slowT=Math.max(0,slowT-dt);revT=Math.max(0,revT-dt);accT=Math.max(0,accT-dt);
  var L=levels[lvlIdx];
  var spd=L.speed*(slowT>0?0.35:1);
  var dir=revT>0?-1:1;

  spawnT-=dt;
  if(spawned<L.balls&&spawnT<=0){spawnBall();spawnT=0.34}
  if(spawned<L.balls&&balls.length===0){/* wait */}

  if(dir>0){
    if(balls.length)balls[0].dist+=spd*dt;
    for(var i=1;i<balls.length;i++){
      var gap=balls[i-1].dist-15-balls[i].dist;
      if(gap>0.5){
        balls[i].dist+=Math.min(gap,spd*3.2*dt);
        if(balls[i-1].dist-15-balls[i].dist<=0.5){
          balls[i].dist=balls[i-1].dist-15;
          sfx('clack');
          checkMatch(i);
          if(state!=='play')return;
        }
      }else{
        balls[i].dist=balls[i-1].dist-15;
      }
    }
  }else{
    for(var r=0;r<balls.length;r++)balls[r].dist-=spd*dt;
    for(var q=1;q<balls.length;q++){
      if(balls[q].dist>balls[q-1].dist-15)balls[q].dist=balls[q-1].dist-15;
    }
    if(balls.length&&balls[0].dist<0)balls[0].dist=0;
  }

  if(balls.length&&balls[0].dist>=pathLen-6){
    loseLife();
    return;
  }

  var front=balls[0];
  if(front&&front.d>pathLen-120){
    dangerT-=dt;
    if(dangerT<=0){sfx('danger');dangerT=0.5}
  }

  for(var s=shots.length-1;s>=0;s--){
    var sh=shots[s];
    sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;
    if(sh.x<-12||sh.x>W+12||sh.y<-12||sh.y>H+12){shots.splice(s,1);continue}
    var consumed=false;
    for(var w=0;w<powerups.length;w++){
      var pw=powerups[w],pp=pathPos(pw.d);
      if(Math.hypot(sh.x-pp.x,sh.y-pp.y)<13){activatePower(pw);powerups.splice(w,1);consumed=true;break}
    }
    if(consumed){shots.splice(s,1);continue}
    for(var bi=0;bi<balls.length;bi++){
      var bp=pathPos(balls[bi].d);
      if(Math.hypot(sh.x-bp.x,sh.y-bp.y)<13.5){
        var sd=nearestPathDist(sh.x,sh.y);
        var idx=0;
        while(idx<balls.length&&balls[idx].dist>sd)idx++;
        if(idx>0)sd=Math.min(sd,balls[idx-1].dist-15);
        sd=Math.max(0,sd);
        for(var i=balls.length-1;i>=idx;i--)balls[i+1]={color:balls[i].color,d:balls[i].dist-15};
        balls[idx]={color:sh.color,d:sd};
        shots.splice(s,1);
        sfx('insert');
        checkMatch(idx);
        if(state!=='play')return;
        consumed=true;
        break;
      }
    }
  }
}

function activatePower(pw){
  sfx('power');
  flash=0.25;flashCol='#9cf';
  shake=Math.min(10,shake+3);
  var pp=pathPos(pw.d);
  if(pw.type==='bomb'){
    sfx('bomb');
    var killed=[];
    for(var i=0;i<balls.length;i++){
      if(Math.abs(balls[i].d-pw.d)<48)killed.push(i);
    }
    for(var k=killed.length-1;k>=0;k--){
      var pos=pathPos(balls[killed[k]].d),col=COLORS[balls[killed[k]]].color;
      for(var m=0;m<6;m++){var a2=Math.random()*Math.PI*2;parts.push({x:pos.x,y:pos.y,vx:Math.cos(a2)*3,vy:Math.sin(a2)*3,life:22,col:col.c1,r:2})}
    }
    score+=killed.length*150;
    floats.push({txt:'BOOM! +'+(killed.length*150),life:50,x:pp.x,y:pp.y-10,col:'#ff9a5a',size:9});
    for(var z=killed.length-1;z>=0;z--)balls.splice(killed[z],1);
    if(balls.length===0){levelClear();return}
  }else if(pw.type==='slow'){
    slowT=6;
    floats.push({txt:'SLOW TIME!',life:50,x:pp.x,y:pp.y-10,col:'#5ec8ff',size:9});
  }else if(pw.type==='reverse'){
    revT=3;
    floats.push({txt:'REVERSE!',life:50,x:pp.x,y:pp.y-10,col:'#c99aff',size:9});
  }
}

function drawBall(x,y,ci,scale){
  scale=scale||1;
  var col=COLORS[ci];
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath();ctx.ellipse(x+1.5,y+2.5,6.5*scale,4.5*scale,0,0,Math.PI*2);ctx.fill();
  var g=ctx.createRadialGradient(x-2*scale,y-2.5*scale,1,x,y,7.5*scale);
  g.addColorStop(0,'#fff');g.addColorStop(0.3,col.c1);g.addColorStop(1,col.c2);
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(x,y,7*scale,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(x,y,7*scale,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.beginPath();ctx.arc(x-2.2*scale,y-2.8*scale,1.8*scale,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function draw(){
  var sx=shake?(Math.random()-0.5)*shake:0,sy=shake?(Math.random()-0.5)*shake:0;
  ctx.save();ctx.translate(sx,sy);
  var bg=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,200);
  bg.addColorStop(0,'#1a1230');bg.addColorStop(1,'#07050d');
  ctx.fillStyle=bg;ctx.fillRect(-10,-10,W+20,H+20);
  ctx.strokeStyle='rgba(255,255,255,.03)';
  for(var gy=0;gy<H;gy+=24){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke()}

  if(path){
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=17;ctx.lineJoin='round';
    ctx.beginPath();
    for(var i=0;i<path.length;i+=6){if(i===0)ctx.moveTo(path[i].x,path[i].y);else ctx.lineTo(path[i].x,path[i].y)}
    ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=13;
    ctx.beginPath();
    for(var j=0;j<path.length;j+=6){if(j===0)ctx.moveTo(path[j].x,path[j].y);else ctx.lineTo(path[j].x,path[j].y)}
    ctx.stroke();

    var end=path[path.length-1];
    var pulse=1+Math.sin(performance.now()/300)*0.08;
    ctx.save();
    ctx.shadowColor=balls.length&&balls[0].d>pathLen-120?'#f44':'#a05aff';ctx.shadowBlur=14;
    ctx.fillStyle='#1a0a2a';
    ctx.beginPath();ctx.arc(end.x,end.y,13*pulse,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#a05aff';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(end.x,end.y,13*pulse,0,Math.PI*2);ctx.stroke();
    ctx.restore();
    ctx.fillStyle='#a05aff';
    ctx.beginPath();ctx.arc(end.x-3,end.y-3,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(end.x+3,end.y-3,2,0,Math.PI*2);ctx.fill();
  }

  for(var w=0;w<powerups.length;w++){
    var pw=powerups[w],pp=pathPos(pw.d);
    pw.pulse+=0.08;
    var pc=1+Math.sin(pw.pulse)*0.15;
    ctx.save();ctx.shadowBlur=10;
    if(pw.type==='bomb'){ctx.shadowColor='#f80';ctx.fillStyle='#2a1a00';ctx.beginPath();ctx.arc(pp.x,pp.y,8*pc,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ff9a00';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#ff9a00';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText('B',pp.x,pp.y+3)}
    else if(pw.type==='slow'){ctx.shadowColor='#5ec8ff';ctx.fillStyle='#0a2a4a';ctx.beginPath();ctx.arc(pp.x,pp.y,8*pc,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#5ec8ff';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#5ec8ff';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText('S',pp.x,pp.y+3)}
    else{ctx.shadowColor='#c99aff';ctx.fillStyle='#2a0a3a';ctx.beginPath();ctx.arc(pp.x,pp.y,8*pc,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#c99aff';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#c99aff';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.fillText('R',pp.x,pp.y+3)}
    ctx.restore();
  }

  for(var b=0;b<balls.length;b++){
    var bp=pathPos(balls[b].d);
    drawBall(bp.x,bp.y,balls[b].color,1);
  }

  for(var s=0;s<shots.length;s++){
    drawBall(shots[s].x,shots[s].y,shots[s].color,1);
  }

  var lx=W/2,ly=H/2+4;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.beginPath();ctx.ellipse(lx,ly+14,12,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2a1a3a';
  ctx.beginPath();ctx.arc(lx,ly,12,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#5a3a7a';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(lx,ly,12,0,Math.PI*2);ctx.stroke();
  ctx.translate(lx,ly);
  ctx.rotate(aimA);
  ctx.translate(0,recoil*3);
  ctx.fillStyle='#3a2a4a';
  ctx.fillRect(0,-3.5,15,7);
  ctx.restore();
  if(!launched)drawBall(lx,ly,curColor,1);
  else drawBall(lx,ly+recoil*3,curColor,1);
  drawBall(lx+16,ly+10,nextColor,0.6);

  if(accT>0&&!launched){
    ctx.strokeStyle='rgba(110,255,160,.4)';ctx.lineWidth=1;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(lx,ly);
    ctx.lineTo(lx+Math.cos(aimA)*120,ly+Math.sin(aimA)*120);ctx.stroke();ctx.setLineDash([]);
  }

  for(var q=0;q<parts.length;q++){var pt=parts[q];ctx.globalAlpha=Math.min(1,pt.life/14);ctx.fillStyle=pt.col;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;

  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,18);
  ctx.fillStyle='#ffe066';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText('SCORE '+score,4,8);
  ctx.textAlign='center';ctx.fillStyle='#9cf';ctx.font='7px monospace';
  ctx.fillText('LEVEL '+(lvlIdx+1)+'/'+levels.length+(slowT>0?'  SLOW':'')+(revT>0?'  REV':''),W/2,8);
  ctx.textAlign='right';ctx.fillStyle='#ff6b6b';ctx.font='bold 9px monospace';
  ctx.fillText('♥'.repeat(Math.max(0,lives)),W-4,8);

  var remain=(levels[lvlIdx].balls-spawned)+balls.length;
  var total=levels[lvlIdx].balls;
  ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(0,H-6,W,4);
  ctx.fillStyle='#7dff6a';ctx.fillRect(0,H-6,W*(1-remain/total),4);

  for(var f=0;f<floats.length;f++){var fl=floats[f];ctx.globalAlpha=Math.min(1,fl.life/18);ctx.fillStyle=fl.col;ctx.font='bold '+fl.size+'px monospace';ctx.textAlign='center';ctx.fillText(fl.txt,fl.x,fl.y)}ctx.globalAlpha=1;

  if(flash>0){ctx.globalAlpha=flash;ctx.fillStyle=flashCol;ctx.fillRect(-10,-10,W+20,H+20);ctx.globalAlpha=1}
  ctx.restore();

  if(state==='title')drawTitle();
  else if(state==='clear'){} 
  else if(state==='over')drawOver();
  else if(state==='win')drawWin();
}

function drawTitle(){
  ctx.fillStyle='rgba(5,3,12,.9)';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.shadowColor='#a05aff';ctx.shadowBlur=16;
  ctx.fillStyle='#ffe066';ctx.font='bold 30px monospace';ctx.textAlign='center';
  ctx.fillText('ZUMA',W/2,80);
  ctx.restore();
  ctx.fillStyle='#c99aff';ctx.font='bold 8px monospace';ctx.fillText('MARBLE POP • R1 EDITION',W/2,98);
  drawBall(W/2-46,130,0,1.4);drawBall(W/2-16,130,1,1.4);drawBall(W/2+14,130,2,1.4);drawBall(W/2+44,130,3,1.4);
  ctx.fillStyle='#cfe';ctx.font='7px monospace';ctx.fillText('Match 3+ balls to pop them',W/2,168);
  ctx.fillText('Clear the chain before the skull!',W/2,180);
  ctx.fillStyle='#9cf';ctx.font='6px monospace';ctx.fillText('CLICK shoot • SCROLL swap ball',W/2,200);
  ctx.fillText('Chain pops = COMBO points',W/2,210);
  ctx.fillStyle='#ffe066';ctx.font='bold 11px monospace';
  ctx.fillText('TAP TO PLAY',W/2,244);
}
function drawOver(){
  ctx.fillStyle='rgba(5,3,12,.85)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f66';ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,110);
  ctx.fillStyle='#fff';ctx.font='10px monospace';ctx.fillText('SCORE '+score,W/2,140);
  ctx.fillStyle='#ffe066';ctx.font='bold 10px monospace';ctx.fillText('TAP TO RETRY',W/2,180);
}
function drawWin(){
  ctx.fillStyle='rgba(5,3,12,.88)';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.shadowColor='#ffe066';ctx.shadowBlur=14;
  ctx.fillStyle='#ffe066';ctx.font='bold 22px monospace';ctx.textAlign='center';ctx.fillText('YOU WIN!',W/2,110);
  ctx.restore();
  ctx.fillStyle='#fff';ctx.font='10px monospace';ctx.fillText('SCORE '+score,W/2,142);
  ctx.fillStyle='#9cf';ctx.font='8px monospace';ctx.fillText('ALL '+(levels.length)+' LEVELS CLEARED',W/2,164);
  ctx.fillStyle='#ffe066';ctx.font='bold 10px monospace';ctx.fillText('TAP TO PLAY AGAIN',W/2,200);
}

function startGame(){score=0;lives=3;loadLevel(0);sfx('levelup')}

cv.addEventListener('mousemove',function(e){
  var r=cv.getBoundingClientRect();
  pointer.x=(e.clientX-r.left)*(W/r.width);pointer.y=(e.clientY-r.top)*(H/r.height);
  aimA=Math.atan2(pointer.y-(H/2+4),pointer.x-W/2);
});
cv.addEventListener('click',function(e){
  if(state==='title'){startGame();return}
  if(state==='over'||state==='win'){startGame();return}
  if(state==='clear')return;
  var r=cv.getBoundingClientRect();
  pointer.x=(e.clientX-r.left)*(W/r.width);pointer.y=(e.clientY-r.top)*(H/r.height);
  aimA=Math.atan2(pointer.y-(H/2+4),pointer.x-W/2);
  shoot();
});
var skipEnd=false;
cv.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(state==='title'||state==='over'||state==='win'){startGame();skipEnd=true;return}
  var t=e.touches[0],r=cv.getBoundingClientRect();
  pointer.x=(t.clientX-r.left)*(W/r.width);pointer.y=(t.clientY-r.top)*(H/r.height);
  aimA=Math.atan2(pointer.y-(H/2+4),pointer.x-W/2);
},{passive:false});
cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  var t=e.touches[0],r=cv.getBoundingClientRect();
  pointer.x=(t.clientX-r.left)*(W/r.width);pointer.y=(t.clientY-r.top)*(H/r.height);
  aimA=Math.atan2(pointer.y-(H/2+4),pointer.x-W/2);
},{passive:false});
cv.addEventListener('touchend',function(e){
  e.preventDefault();
  if(skipEnd){skipEnd=false;return}
  if(state==='play')shoot();
},{passive:false});
window.addEventListener('wheel',function(e){
  if(state==='play'){e.preventDefault();swapBalls()}
},{passive:false});
window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();if(state==='title'||state==='over'||state==='win')startGame();else shoot()}
  if(k==='s')swapBalls();
  if(k==='p'||k==='escape'){if(state==='play')state='title'}
  if(k==='arrowleft')aimA-=0.08;
  if(k==='arrowright')aimA+=0.08;
});

function loop(now){
  var dt=Math.min(0.033,(now-(loop.last||now))/1000);loop.last=now;
  update(dt);draw();
  requestAnimationFrame(loop);
}
buildPath(levels[0]);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
