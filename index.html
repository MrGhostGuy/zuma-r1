/* ── Audio ── */
var AC=null,BUS=null;
function actx(){if(AC===null){try{AC=new(window.AudioContext||window.webkitAudioContext)();BUS=AC.createGain();BUS.gain.value=0.85;BUS.connect(AC.destination)}catch(e){AC=false}}return AC}
function tone(f0,f1,dur,type,vol,delay){
  var a=actx();if(!a)return;var t=a.currentTime+(delay||0);
  var o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol||0.1,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(BUS||a.destination);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol,fType,f0,f1,delay){
  var a=actx();if(!a)return;var t=a.currentTime+(delay||0);
  var len=Math.max(1,Math.floor(a.sampleRate*dur));
  var buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  var s=a.createBufferSource();s.buffer=buf;
  var f=a.createBiquadFilter();f.type=fType||'bandpass';
  f.frequency.setValueAtTime(f0||800,t);
  if(f1&&f1!==f0)f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
  f.Q.value=1.2;
  var g=a.createGain();g.gain.setValueAtTime(vol||0.1,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(BUS||a.destination);s.start(t);s.stop(t+dur+0.02);
}
function sfx(n,v){
  if(!actx())return;v=v||1;
  if(n==='launch'){noise(0.09,0.12*v,'bandpass',1400,300);tone(320,90,0.09,'triangle',0.08*v);}
  else if(n==='clack'){var p=1800+Math.random()*700;noise(0.025,0.08*v,'highpass',p);tone(p,p*0.8,0.02,'square',0.025*v);}
  else if(n==='pop'){var b=500*(1+((v-1)*0.12));tone(b,b*0.28,0.13,'sine',0.15);tone(b*2,b*0.56,0.1,'triangle',0.07);noise(0.08,0.07*v,'lowpass',2000,500);}
  else if(n==='swap'){tone(700,500,0.05,'sine',0.07);tone(500,700,0.05,'sine',0.07,0.05);}
  else if(n==='power'){tone(520,520,0.07,'sine',0.09);tone(660,660,0.07,'sine',0.09,0.07);tone(880,880,0.1,'sine',0.1,0.14);}
  else if(n==='bomb'){noise(0.35,0.22,'lowpass',900,120);tone(180,40,0.3,'sawtooth',0.12);}
  else if(n==='lose'){tone(320,80,0.5,'sawtooth',0.1);noise(0.3,0.07,'lowpass',500,100);}
  else if(n==='win'){tone(523,523,0.1,'square',0.08);tone(659,659,0.1,'square',0.08,0.1);tone(784,784,0.1,'square',0.08,0.2);tone(1046,1046,0.22,'square',0.1,0.3);}
  else if(n==='levelup'){tone(440,440,0.08,'triangle',0.09);tone(554,554,0.08,'triangle',0.09,0.08);tone(659,659,0.08,'triangle',0.09,0.16);tone(880,880,0.18,'triangle',0.11,0.24);}
  else if(n==='insert'){tone(240,180,0.05,'triangle',0.05);}
  else if(n==='heart'){tone(80,60,0.12,'sine',0.12);tone(70,50,0.1,'sine',0.08,0.15);}
  else if(n==='zap'){noise(0.18,0.16*v,'highpass',3200,1200);tone(1500,320,0.16,'square',0.06*v);tone(900,190,0.18,'sawtooth',0.05*v,0.02);}
  else if(n==='mult'){tone(660,990,0.09,'square',0.08);tone(990,1320,0.12,'square',0.09,0.09);}
  else if(n==='lock'){tone(1250,1500,0.045,'sine',0.05);}
  else if(n==='mode'){tone(500,500,0.05,'square',0.06);tone(750,750,0.06,'square',0.06,0.05);}
}

var musicStarted=false,musicOn=true,nextBeat=0,beatN=0,droneGain=null;
function startMusic(){
  var a=actx();if(!a||musicStarted)return;musicStarted=true;
  if(a.state==='suspended'){try{a.resume()}catch(e){}}
  droneGain=a.createGain();droneGain.gain.value=0.0001;droneGain.connect(BUS||a.destination);
  droneGain.gain.setTargetAtTime(musicOn?0.055:0.0001,a.currentTime,2.5);
  var filt=a.createBiquadFilter();filt.type='lowpass';filt.frequency.value=430;filt.Q.value=4;filt.connect(droneGain);
  var freqs=[55,55.5,82.5];
  for(var i=0;i<freqs.length;i++){var o=a.createOscillator();o.type=i===2?'triangle':'sawtooth';o.frequency.value=freqs[i];
    var g=a.createGain();g.gain.value=i===2?0.45:0.3;o.connect(g);g.connect(filt);o.start();}
  var lfo=a.createOscillator();lfo.frequency.value=0.07;var lg=a.createGain();lg.gain.value=150;lfo.connect(lg);lg.connect(filt.frequency);lfo.start();
  nextBeat=a.currentTime+0.25;
}
function chant(vol,dl){
  var a=actx();if(!a)return;
  tone(158,150,0.18,'sawtooth',0.05*vol,dl);
  noise(0.12,0.04*vol,'bandpass',780,720,dl);
  tone(136,128,0.2,'sawtooth',0.045*vol,dl+0.17);
  noise(0.14,0.035*vol,'bandpass',690,620,dl+0.17);
}
function beat(){
  var a=actx();if(!a)return;var dl=nextBeat-a.currentTime;if(dl<0)dl=0;
  var b=beatN%4;
  if(b===0){tone(150,68,0.24,'sine',0.10,dl);noise(0.05,0.03,'highpass',6500,5200,dl);}
  else if(b===2){tone(196,92,0.18,'sine',0.085,dl);noise(0.05,0.03,'highpass',6500,5200,dl);}
  else{tone(120,60,0.15,'sine',0.06,dl);noise(0.04,0.02,'highpass',7000,5600,dl+0.12);}
  if(beatN%16===0&&state==='play')chant(1,dl+0.02);
  beatN++;nextBeat+=(state==='play'?0.5:0.62);
  if(nextBeat<a.currentTime)nextBeat=a.currentTime+0.5;
}
function musicTick(){if(!musicStarted||!musicOn)return;var a=actx();if(!a)return;var guard=0;while(nextBeat<a.currentTime+0.08&&guard++<8)beat();}
function toggleMusic(){musicOn=!musicOn;var a=actx();if(droneGain&&a)droneGain.gain.setTargetAtTime(musicOn?0.055:0.0001,a.currentTime,0.3);if(musicOn&&a)nextBeat=a.currentTime+0.1;}

/* ── Path builders ── */
function arcPts(cx,cy,r,a0,a1,steps){
  var out=[],n=Math.max(2,Math.ceil(Math.abs(a1-a0)/(Math.PI/2/(steps||12))));
  for(var i=0;i<=n;i++){var a=a0+(a1-a0)*i/n;out.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});}
  return out;
}
function catmull(cps,spc){
  var out=[],n=cps.length;if(n<2)return cps;
  for(var i=0;i<n-1;i++){
    var p0=cps[Math.max(0,i-1)],p1=cps[i],p2=cps[i+1],p3=cps[Math.min(n-1,i+2)];
    for(var j=0;j<spc;j++){
      var t=j/spc,t2=t*t,t3=t2*t;
      out.push({x:0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
                y:0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)});
    }
  }
  out.push({x:cps[n-1].x,y:cps[n-1].y});
  return out;
}
function smooth(pts,passes){
  for(var p=0;p<(passes||1);p++){
    for(var i=1;i<pts.length-1;i++){
      pts[i].x=(pts[i-1].x+pts[i].x*2+pts[i+1].x)*0.25;
      pts[i].y=(pts[i-1].y+pts[i].y*2+pts[i+1].y)*0.25;
    }
  }
  return pts;
}
function concat(){var out=[];for(var i=0;i<arguments.length;i++)for(var j=0;j<arguments[i].length;j++)out.push(arguments[i][j]);return out;}

function buildPath(pts){
  var d=0;
  for(var i=0;i<pts.length;i++){
    if(i>0)d+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
    pts[i].d=d;
  }
  path=pts;pathLen=d;
}

function pathPos(dist){
  if(!path||!path.length)return{x:W/2,y:H/2};
  if(dist<=0)return{x:path[0].x,y:path[0].y};
  if(dist>=pathLen){var b=path[path.length-1];return{x:b.x,y:b.y}}
  var lo=0,hi=path.length-1;
  while(lo<hi){var mid=(lo+hi)>>1;if(path[mid].d<dist)lo=mid+1;else hi=mid}
  var p2=path[lo],p1=path[lo-1]||p2;
  var seg=p2.d-p1.d||1,t=(dist-p1.d)/seg;
  return{x:p1.x+(p2.x-p1.x)*t,y:p1.y+(p2.y-p1.y)*t};
}
function pathTan(dist){
  var p1=pathPos(dist-2),p2=pathPos(dist+2);
  var dx=p2.x-p1.x,dy=p2.y-p1.y,l=Math.hypot(dx,dy)||1;
  return{x:dx/l,y:dy/l};
}
function nearestPathDist(x,y){
  var bd=1e18,best=0;
  for(var i=0;i<path.length-1;i++){
    var a=path[i],b=path[i+1];
    var ex=b.x-a.x,ey=b.y-a.y,len2=ex*ex+ey*ey;
    var t=len2>1e-9?((x-a.x)*ex+(y-a.y)*ey)/len2:0;

function computeGuide(){

  var mx=frogX+Math.cos(aimA)*13,my=frogY+Math.sin(aimA)*13;
  var maxL=accT>0?280:200,step=5,rad2=196;

  var cosA=Math.cos(aimA),sinA=Math.sin(aimA);

    if(x<-6||x>W+6||y<-6||y>H+6){guide.push({x:x,y:y,term:true});break}
    var hit=false;
    for(var b=0;b<bpos.length;b++){var dx=x-bpos[b].x,dy=y-bpos[b].y;if(dx*dx+dy*dy<rad2){hit=true;break}}

/* ── Core game logic ── */

}

  if(act.length===1&&Math.random()<0.5)return act[0];

}
var curCn=4;

function cfg(idx){
  var N=LEVELS.length;
  if(idx<N)return LEVELS[idx];
  var k=idx-N,last=LEVELS[N-1];
  return{colors:Math.min(7,last.colors+Math.floor(k/4)),balls:last.balls+k*12,speed:Math.min(54,last.speed+k*1.1),path:idx%N,frog:LEVELS[idx%N].frog};
}

function loadLevel(idx){
  lvlIdx=idx;

  curCn=L.colors;curSpeed=L.speed;totalBalls=L.balls;

  spawned=0;spawnT=0.5;slowT=0;revT=0;multT=0;accT=0;combo=0;recoil=0;swapT=0;dangerAmt=0;shake=0;flash=0;heartT=0;
  curC=(Math.random()*L.colors)|0;nextC=(Math.random()*L.colors)|0;

function startGame(from){

}

function spawnBall(){
  if(spawned>=totalBalls)return;
  balls.push({color:pickColor(),d:-2});spawned++;
}

function shoot(){
  if(state!=='play'||shootCD>0)return;
  var mx=frogX+Math.cos(aimA)*13,my=frogY+Math.sin(aimA)*13;
  shots.push({x:mx,y:my,vx:Math.cos(aimA)*SHOTSPD,vy:Math.sin(aimA)*SHOTSPD,color:curC});
  curC=nextC;nextC=pickColor();
  shootCD=SHOOTCD;recoil=1;sfx('launch');
  for(var _sp=0;_sp<3;_sp++){var _sa=aimA+(Math.random()-0.5)*0.75,_sdd=1+Math.random()*1.5;
    parts.push({x:mx,y:my,vx:Math.cos(_sa)*28*_sdd,vy:Math.sin(_sa)*28*_sdd,life:0.12+Math.random()*0.07,max:0.19,col:'#fff',r:1.1+Math.random()*0.7,spark:true});}
}
function swapBalls(){
  if(state!=='play'||swapT>0)return;
  var t=curC;curC=nextC;nextC=t;swapT=0.18;sfx('swap');
}

function checkMatch(idx){
  if(idx<0||idx>=balls.length)return false;
  var c=balls[idx].color,a=idx,b=idx;
  while(a>0&&balls[a-1].color===c&&(balls[a-1].d-balls[a].d)<SP+1)a--;
  while(b<balls.length-1&&balls[b+1].color===c&&(balls[b].d-balls[b+1].d)<SP+1)b++;
  if(b-a+1>=3){popBalls(a,b);return true}
  return false;
}
function popBalls(a,b){
  var n=b-a+1,now=performance.now()/1000;
  combo=(now-lastPopT<1.4)?combo+1:1;lastPopT=now;
  var pts=Math.round(n*50*combo*(multT>0?2:1));score+=pts;
  var midD=balls[Math.floor((a+b)/2)].d,mp=pathPos(midD);
  for(var i=a;i<=b;i++){
    var bp=pathPos(balls[i].d);
    spawnPop(bp.x,bp.y,balls[i].color,8);
  }
  floats.push({txt:'+'+pts,life:0.8,x:mp.x,y:mp.y-10,col:'#ffe066',size:9});
  if(combo>=2)floats.push({txt:'COMBO x'+combo,life:1,x:mp.x,y:mp.y-22,col:'#ff9a5a',size:8});
  if(combo>=4)floats.push({txt:'INCREDIBLE!',life:1.2,x:mp.x,y:mp.y-34,col:'#ff6b6b',size:9});
  if(combo>=2)shake=Math.min(8,shake+combo*0.7);
  flash=Math.min(0.2,0.07*combo);flashCol='#fff';
  sfx('pop',combo);
  if(Math.random()<0.18){
    var r=Math.random(),tp;
    if(r<0.26)tp='bomb';else if(r<0.46)tp='slow';else if(r<0.60)tp='reverse';
    else if(r<0.78)tp='lightning';else if(r<0.89)tp='accuracy';else tp='multiplier';
    powerups.push({d:midD,type:tp,pulse:Math.random()*6});
  }
  balls.splice(a,n);
  if(!balls.length&&spawned>=totalBalls){levelClear();return true}
  return false;
}

function removeIndices(idx){
  idx.sort(function(a,b){return a-b});
  for(var i=idx.length-1;i>=0;i--)balls.splice(idx[i],1);
}
function activatePower(pw){
  var pp=pathPos(Math.max(0,Math.min(pathLen,pw.d)));
  sfx('power');flash=0.2;flashCol='#9cf';shake=Math.min(8,shake+2);
  var now=performance.now()/1000;
  if(pw.type==='bomb'||pw.type==='lightning'){
    var killed=[];
    if(pw.type==='bomb'){
      sfx('bomb');shake=7;flash=0.3;flashCol='#ff9a00';
      for(var i=0;i<balls.length;i++)if(Math.abs(balls[i].d-pw.d)<46)killed.push(i);
    }else{
      sfx('zap');flash=0.3;flashCol='#bfe8ff';shake=6;
      var ni=-1,nd=1e9;
      for(var q=0;q<balls.length;q++){var ad=Math.abs(balls[q].d-pw.d);if(ad<nd){nd=ad;ni=q}}
      if(ni>=0){
        var col=balls[ni].color;
        for(var j=0;j<balls.length;j++)if(balls[j].color===col&&Math.abs(balls[j].d-pw.d)<150)killed.push(j);
        var bp2=pathPos(balls[ni].d);
        bolts.push({pts:[{x:pp.x,y:-10},{x:bp2.x+(Math.random()-0.5)*40,y:bp2.y-46},{x:bp2.x+(Math.random()-0.5)*18,y:bp2.y-20},bp2],life:0.35,max:0.35});
      }
    }
    if(killed.length){
      combo=(now-lastPopT<1.4)?combo+1:1;lastPopT=now;
      var pts=Math.round(killed.length*(pw.type==='lightning'?80:100)*combo*(multT>0?2:1));score+=pts;
      for(var k=0;k<killed.length;k++){var kp=pathPos(balls[killed[k]].d);spawnPop(kp.x,kp.y,balls[killed[k]].color,6);}
      floats.push({txt:(pw.type==='lightning'?'ZAP! +':'BOOM! +')+pts,life:1,x:pp.x,y:pp.y-10,col:pw.type==='lightning'?'#9fe0ff':'#ff9a5a',size:9});
      removeIndices(killed);
      if(!balls.length&&spawned>=totalBalls){levelClear();return}
    }
  }else if(pw.type==='slow'){
    slowT=5;floats.push({txt:'SLOW TIME!',life:1,x:pp.x,y:pp.y-10,col:'#5ec8ff',size:9});
  }else if(pw.type==='reverse'){
    revT=2.5;floats.push({txt:'REVERSE!',life:1,x:pp.x,y:pp.y-10,col:'#c99aff',size:9});
  }else if(pw.type==='accuracy'){
    accT=6;floats.push({txt:'ACCURACY!',life:1,x:pp.x,y:pp.y-10,col:'#9ef',size:9});sfx('lock');
  }else if(pw.type==='multiplier'){
    multT=8;floats.push({txt:'SCORE x2!',life:1,x:pp.x,y:pp.y-10,col:'#ffd54a',size:9});sfx('mult');
  }
}

function levelClear(){
  var bonus=500+lvlIdx*100+lives*150;
  score+=bonus;sfx('win');flash=0.3;flashCol='#ffe066';
  floats.push({txt:endless?'WAVE CLEAR!':'LEVEL CLEAR!',life:1.5,x:W/2,y:H/2-20,col:'#ffe066',size:12});
  floats.push({txt:'+'+bonus,life:1.5,x:W/2,y:H/2-6,col:'#fff',size:9});
  clearT=1.5;state='clear';
}
function startDying(){
  if(state!=='play')return;
  state='dying';dieT=0.9;lives--;sfx('lose');
  shake=8;flash=0.35;flashCol='#f44';
}
function gameOver(){
  if(score>best){best=score;try{localStorage.setItem('z1best',best)}catch(e){}}
  state='over';
}

function insertShot(sh){
  var sd=nearestPathDist(sh.x,sh.y);
  var idx=0;
  while(idx<balls.length&&balls[idx].d>sd)idx++;
  if(idx>0)sd=Math.min(sd,balls[idx-1].d-SP);
  if(idx<balls.length)sd=Math.max(sd,balls[idx].d);
  sd=Math.max(sd,-5);
  for(var i=balls.length-1;i>=idx;i--)balls[i].d-=SP;
  balls.splice(idx,0,{color:sh.color,d:sd});
  var ip=pathPos(sd);
  spawnInsert(ip.x,ip.y);
  sfx('insert');
  checkMatch(idx);
}

function update(dt){
  if(state==='intro'){introT-=dt;if(introT<=0)state='play';return}
  if(state==='clear'){
    clearT-=dt;updateParts(dt);updateFloats(dt);
    if(clearT<=0){
      var next=lvlIdx+1;
      if(!endless&&next>=LEVELS.length){state='win';return}
      loadLevel(next);sfx('levelup');
    }
    return;
  }
  if(state==='dying'){
    dieT-=dt;updateParts(dt);updateFloats(dt);
    for(var i=0;i<balls.length;i++){
      balls[i].d+=(pathLen+30-balls[i].d)*5*dt+60*dt;
    }
    shake=Math.max(0,shake-dt*20);flash=Math.max(0,flash-dt*3);
    if(dieT<=0){
      if(lives<=0)gameOver();
      else loadLevel(lvlIdx);
    }
    return;
  }
  if(state!=='play')return;
  shake=Math.max(0,shake-dt*26);flash=Math.max(0,flash-dt*4);
  recoil=Math.max(0,recoil-dt*8);shootCD=Math.max(0,shootCD-dt);
  if(swapT>0)swapT-=dt;
  slowT=Math.max(0,slowT-dt);revT=Math.max(0,revT-dt);
  multT=Math.max(0,multT-dt);accT=Math.max(0,accT-dt);
  if(accT>0&&balls.length){
    var bestA=null,bd=1e9;
    for(var ai=0;ai<balls.length;ai++){
      if(balls[ai].color!==curC)continue;
      var ap=pathPos(balls[ai].d),adx=ap.x-frogX,ady=ap.y-frogY;
      var diff=wrapPi(Math.atan2(ady,adx)-aimA);
      if(Math.abs(diff)<0.6&&Math.abs(diff)<bd){bd=Math.abs(diff);bestA=diff}
    }
    if(bestA!==null)aimA+=bestA*Math.min(1,dt*5);
  }
  updateParts(dt);updateFloats(dt);
  var spd=curSpeed*(slowT>0?0.32:1);
  var dir=revT>0?-1:1;
  spawnT-=dt;
  if(spawned<totalBalls&&spawnT<=0){
    var last=balls[balls.length-1];
    if(!last||last.d>SP-4){spawnBall();spawnT=Math.max(0.22,0.38-lvlIdx*0.012)}
  }
  if(dir>0){
    if(balls.length)balls[0].d+=spd*dt;
    for(var i=1;i<balls.length;i++){
      var target=balls[i-1].d-SP,gap=target-balls[i].d;
      if(gap>0.4){
        balls[i].d+=Math.min(gap,spd*CATCH*dt);
        if(target-balls[i].d<=0.4){
          balls[i].d=target;sfx('clack');
          checkMatch(i);if(state!=='play')return;
        }
      }else if(gap<0){balls[i].d=target}
    }
  }else{
    for(var j=0;j<balls.length;j++)balls[j].d-=spd*dt;
    if(balls.length&&balls[0].d<0)balls[0].d=0;
    for(var k=1;k<balls.length;k++){
      var t2=balls[k-1].d-SP;
      if(balls[k].d>t2){balls[k].d=t2;checkMatch(k);if(state!=='play')return}
    }
  }
  if(balls.length&&balls[0].d>=pathLen-4){startDying();return}
  if(balls.length&&balls[0].d>pathLen-130){
    dangerAmt=Math.min(1,dangerAmt+dt*2);
    heartT-=dt;if(heartT<=0){sfx('heart');heartT=0.55}
  }else{dangerAmt=Math.max(0,dangerAmt-dt*3)}
  for(var s=shots.length-1;s>=0;s--){
    var sh=shots[s];sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;
    if(sh.x<-12||sh.x>W+12||sh.y<-12||sh.y>H+12){shots.splice(s,1);continue}
    var consumed=false;
    for(var w=0;w<powerups.length;w++){
      var pw=powerups[w],pp=pathPos(Math.max(0,pw.d));
      var pdx=sh.x-pp.x,pdy=sh.y-pp.y;
      if(pdx*pdx+pdy*pdy<144){activatePower(pw);powerups.splice(w,1);shots.splice(s,1);consumed=true;break}
    }
    if(consumed){if(state!=='play')return;continue}
    for(var bi=0;bi<balls.length;bi++){
      if(balls[bi].d<-2)continue;
      var bp=pathPos(balls[bi].d);
      var bdx=sh.x-bp.x,bdy=sh.y-bp.y;
      if(bdx*bdx+bdy*bdy<182){insertShot(sh);shots.splice(s,1);consumed=true;break}
    }
    if(state!=='play')return;
  }
}

/* ── Drawing ── */
function draw(){
  computeGuide();
  var sx=shake>0?(Math.random()-0.5)*shake:0;
  var sy=shake>0?(Math.random()-0.5)*shake:0;
  ctx.save();ctx.translate(sx,sy);
  if(bgCv)ctx.drawImage(bgCv,0,0);
  for(var mi=0;mi<motes.length;mi++){
    var mo=motes[mi],ma=mo.al*(0.55+0.45*Math.sin(mo.ph));
    ctx.globalAlpha=Math.max(0,ma);
    ctx.fillStyle='#b9a8ff';
    ctx.beginPath();ctx.arc(mo.x,mo.y,mo.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(trackCv)ctx.drawImage(trackCv,0,0);
  if(path&&state!=='title'){
    var endP=path[path.length-1];
    var pulse=1+Math.sin(performance.now()/300)*0.06;
    if(dangerAmt>0.1){
      ctx.save();ctx.globalAlpha=dangerAmt*(0.4+0.2*Math.sin(performance.now()/200));
      ctx.fillStyle='#f44';ctx.shadowColor='#f44';ctx.shadowBlur=12;
      ctx.beginPath();ctx.arc(endP.x,endP.y,14*pulse,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    ctx.save();ctx.globalAlpha=0.5+dangerAmt*0.3;
    ctx.fillStyle='#ff3030';ctx.shadowColor='#ff3030';ctx.shadowBlur=8*(1+dangerAmt);
    ctx.beginPath();ctx.arc(endP.x-4,endP.y-4,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(endP.x+3,endP.y-4,2,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  for(var w=0;w<powerups.length;w++){
    var pw=powerups[w],pp=pathPos(Math.max(0,pw.d));
    pw.pulse+=0.06;
    var pc=1+Math.sin(pw.pulse)*0.12;
    ctx.save();ctx.shadowBlur=8;
    if(pw.type==='bomb'){ctx.shadowColor='#f80';ctx.fillStyle='#1a0e00';ctx.beginPath();ctx.arc(pp.x,pp.y,8*pc,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ff9a00';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#ff9a00';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.fillText('B',pp.x,pp.y+3)}
    else if(pw.type==='slow'){ctx.shadowColor='#5ec8ff';ctx.fillStyle='#0a1a2a';ctx.beginPath();ctx.arc(pp.x,pp.y,8*pc,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#5ec8ff';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#5ec8ff';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.fillText('S',pp.x,pp.y+3)}
    else if(pw.type==='reverse'){ctx.shadowColor='#c99aff';ctx.fillStyle='#1a0a2a';ctx.beginPath();ctx.arc(pp.x,pp.y,8*pc,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#c99aff';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#c99aff';ctx.font='bold 6px monospace';ctx.textAlign='center';ctx.fillText('R',pp.x,pp.y+3)}
    else if(pw.type==='lightning'){ctx.shadowColor='#8fd8ff';ctx.fillStyle='#04121f';ctx.beginPath();ctx.arc(pp.x,pp.y,8*pc,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#8fd8ff';ctx.lineWidth=1.5;ctx.stroke();ctx.strokeStyle='#dff';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(pp.x-2,pp.y-5);ctx.lineTo(pp.x+1.5,pp.y-1);ctx.lineTo(pp.x-1.5,pp.y-1);ctx.lineTo(pp.x+2,pp.y+5);ctx.stroke()}
    else if(pw.type==='accuracy'){ctx.shadowColor='#9ef';ctx.fillStyle='#0a1a1a';ctx.beginPath();ctx.arc(pp.x,pp.y,8*pc,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#9ef';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#dff';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.fillText('A',pp.x,pp.y+3)}
    else{ctx.shadowColor='#ffd54a';ctx.fillStyle='#1a1400';ctx.beginPath();ctx.arc(pp.x,pp.y,8*pc,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffd54a';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#ffd54a';ctx.font='bold 6px monospace';ctx.textAlign='center';ctx.fillText('x2',pp.x,pp.y+3)}
    ctx.restore();
  }
  drawGuide();
  for(var b=balls.length-1;b>=0;b--){
    if(balls[b].d<-1)continue;
    var bp=pathPos(balls[b].d);
    var bs=balls[b].d<10?0.55+0.045*balls[b].d:1;
    drawMarble(bp.x,bp.y,balls[b].color,bs);
  }
  for(var s=0;s<shots.length;s++)drawMarble(shots[s].x,shots[s].y,shots[s].color,1);
  drawFrog();
  drawBolts();
  for(var p=0;p<parts.length;p++){
    var pt=parts[p];ctx.globalAlpha=Math.max(0,pt.life/pt.max);
    if(pt.spark){ctx.fillStyle='#fff';ctx.fillRect(pt.x-pt.r/2,pt.y-pt.r/2,pt.r,pt.r)}
    else{ctx.fillStyle=pt.col;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill()}
  }
  ctx.globalAlpha=1;
  if(dangerAmt>0.05){
    var dg=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,180);
    dg.addColorStop(0,'rgba(0,0,0,0)');dg.addColorStop(1,'rgba(200,0,0,'+(dangerAmt*0.25+dangerAmt*0.1*Math.sin(performance.now()/180))+')');
    ctx.fillStyle=dg;ctx.fillRect(-10,-10,W+20,H+20);
  }
  if(slowT>0){ctx.fillStyle='rgba(50,100,200,0.08)';ctx.fillRect(-10,-10,W+20,H+20)}
  if(revT>0){ctx.fillStyle='rgba(150,50,200,0.06)';ctx.fillRect(-10,-10,W+20,H+20)}
  if(flash>0){ctx.globalAlpha=flash;ctx.fillStyle=flashCol;ctx.fillRect(-10,-10,W+20,H+20);ctx.globalAlpha=1}
  ctx.restore();
  drawHUD();
  for(var f=0;f<floats.length;f++){var fl=floats[f];ctx.globalAlpha=Math.min(1,fl.life/0.4);ctx.fillStyle=fl.col;ctx.font='bold '+fl.size+'px monospace';ctx.textAlign='center';ctx.fillText(fl.txt,fl.x,fl.y)}ctx.globalAlpha=1;
  if(state==='intro')drawIntro();
  else if(state==='title')drawTitle();
  else if(state==='over')drawOver();
  else if(state==='win')drawWin();
  else if(state==='clear')drawClear();
}

function drawHUD(){
  var g=ctx.createLinearGradient(0,0,0,15);
  g.addColorStop(0,'#2a2018');g.addColorStop(1,'#1a1410');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,15);
  ctx.strokeStyle='#3a3020';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,15);ctx.lineTo(W,15);ctx.stroke();
  ctx.fillStyle='#ffe066';ctx.font='bold 8px monospace';ctx.textAlign='left';
  ctx.fillText(''+score,4,11);
  ctx.textAlign='center';ctx.fillStyle='#9cf';ctx.font='7px monospace';
  var N=LEVELS.length;
  var lvlTxt=endless?'∞'+waveNum():''+(lvlIdx+1)+'/'+N;
  if(slowT>0)lvlTxt+=' ⏳';
  if(revT>0)lvlTxt+=' ↺';
  if(multT>0)lvlTxt+=' ×2';
  if(accT>0)lvlTxt+=' ⊕';
  ctx.fillText(lvlTxt,W/2,11);
  ctx.textAlign='right';ctx.fillStyle='#ff6b6b';ctx.font='bold 8px monospace';
  for(var i=0;i<lives;i++){ctx.fillText('♥',W-4-i*9,11)}
  var remain=(totalBalls-spawned)+balls.length;
  var frac=totalBalls>0?1-remain/totalBalls:0;
  ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(0,H-5,W,3);
  var pg=ctx.createLinearGradient(0,0,W,0);
  pg.addColorStop(0,'#7dff6a');pg.addColorStop(1,'#ffe066');
  ctx.fillStyle=pg;ctx.fillRect(0,H-5,W*frac,3);
}

  ctx.fillText(curCn+' colors • '+totalBalls+' marbles',W/2,H/2+10);

function drawClear(){
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(0,0,W,H);
}

function drawGhost(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.lineWidth=1;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-5,4.5);ctx.lineTo(-5,-2.5);
  ctx.arc(0,-2.5,5,Math.PI,0,false);
  ctx.lineTo(5,4.5);
  ctx.lineTo(3,2);ctx.lineTo(1,5);ctx.lineTo(-1,2);ctx.lineTo(-3,5);ctx.lineTo(-5,2.5);
  ctx.closePath();
  ctx.stroke();
  ctx.fillStyle='rgba(240,250,255,0.75)';
  ctx.beginPath();ctx.arc(-2,-3.5,0.9,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(2,-3.5,0.9,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

/* ── Input ── */
function handleTitleTap(x,y){
  if(maxUnlocked>0&&y>=204&&y<=220){
    if(x<60){titleSel=Math.max(0,titleSel-1);sfx('swap');return}
    if(x>180){titleSel=Math.min(maxUnlocked,titleSel+1);sfx('swap');return}
  }
  if(y>=218&&y<=232){
    var di=modes.indexOf(mode);
    di=(x<120)?(di+modes.length-1)%modes.length:(di+1)%modes.length;
    mode=modes[di];sfx('mode');return;
  }
  startMusic();
  startGame(mode==='gauntlet'?0:titleSel);
}
window.addEventListener('wheel',function(e){
  e.preventDefault();
  if(state==='play')aimA+=e.deltaY*0.0009;
  else if(state==='title')aimA+=e.deltaY*0.0009;
},{passive:false});
cv.addEventListener('click',function(e){
  var now=Date.now();if(now-lastTouchT<700)return;
  startMusic();
  var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*(W/r.width),y=(e.clientY-r.top)*(H/r.height);
  if(state==='title'){handleTitleTap(x,y);return}
  if(state==='over'){startGame(mode==='gauntlet'?0:titleSel);return}
  if(state==='win'){endless=true;loadLevel(LEVELS.length);sfx('levelup');return}
  if(state==='play')shoot();
});
cv.addEventListener('auxclick',function(e){if(e.button===1&&state==='play')shoot()});
cv.addEventListener('contextmenu',function(e){e.preventDefault();if(state==='play')swapBalls()});
var touchStartX=0,touchStartY=0;
cv.addEventListener('touchstart',function(e){
  e.preventDefault();lastTouchT=Date.now();startMusic();
  if(e.touches.length>=2){twoFinger=true;if(state==='play')shoot();return}
  var t=e.touches[0],r=cv.getBoundingClientRect();
  touchStartX=(t.clientX-r.left)*(W/r.width);
  touchStartY=(t.clientY-r.top)*(H/r.height);
},{passive:false});
cv.addEventListener('touchend',function(e){
  e.preventDefault();lastTouchT=Date.now();
  if(twoFinger){if(!e.touches.length)twoFinger=false;return}
  var x=touchStartX;
  if(state==='title'){handleTitleTap(x,touchStartY);return}
  if(state==='over'){startGame(mode==='gauntlet'?0:titleSel);return}
  if(state==='win'){endless=true;loadLevel(LEVELS.length);sfx('levelup');return}
  if(state==='intro'){introT=0;return}
  if(state==='play')swapBalls();
},{passive:false});
window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(k===' '||k==='enter'){e.preventDefault();startMusic();
    if(state==='title')startGame(mode==='gauntlet'?0:titleSel);else if(state==='over')startGame(mode==='gauntlet'?0:titleSel);
    else if(state==='win'){endless=true;loadLevel(LEVELS.length)}else if(state==='play')shoot();
  }
  if(k==='s'&&state==='play')swapBalls();
  if(k==='arrowleft'&&state==='play')aimA-=0.08;
  if(k==='arrowright'&&state==='play')aimA+=0.08;
  if(k==='m')toggleMusic();
  if(k==='escape'&&state==='play')state='title';
});
document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});

/* ── Init ── */
try{best=+localStorage.getItem('z1best')||0;maxUnlocked=+localStorage.getItem('z1max')||0;var _sm=localStorage.getItem('z1mode');if(_sm&&modes.indexOf(_sm)>=0)mode=_sm}catch(e){}
for(var _mi=0;_mi<26;_mi++)motes.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*2.4,vy:-(0.25+Math.random()*0.9),r:0.5+Math.random()*0.8,ph:Math.random()*6.28,al:0.04+Math.random()*0.1});
buildAllMarbles();buildFrog();buildBG();

/* ── Main loop ── */
var acc=0,FIXED=1/120;
function loop(now){
  var dt=Math.min(0.05,(now-(loop.last||now))/1000);loop.last=now;
  acc+=dt;
  while(acc>=FIXED){update(FIXED);acc-=FIXED}
  musicTick();
  updateMotes(dt);
  draw();
  requestAnimationFrame(loop);
}
buildPath(PATHFNS[0]());
renderTrack();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
